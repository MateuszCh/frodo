<mat-sidenav-container class="app-container"
                       autosize="false">
    @if (!isLogin()) {
    <mat-sidenav class="app-sidenav"
                 [mode]="isDesktop() ? 'side' : 'over'"
                 [opened]="isDesktop() || layout.sidenavOpen()"
                 [disableClose]="isDesktop()"
                 (closed)="layout.closeSidenav()">
        <app-sidenav></app-sidenav>
    </mat-sidenav>
    }

    <mat-sidenav-content id="scroll"
                         (scroll)="onScroll()">
        @if (!isLogin() && !isDesktop()) {
        <app-header></app-header>
        }
        <div id="page"
             class="canvas"
             [class.page--login]="isLogin()">
            <router-outlet></router-outlet>
        </div>

        @if (!isLogin()) {
        <button type="button"
                class="fab"
                [class.scrolled]="layout.scrolled()"
                (click)="scrollTop()"
                [attr.aria-label]="t('app.backToTop')">
            <svg class="icon"
                 aria-hidden="true">
                <use href="icons.svg#i-arrow-up" />
            </svg>
        </button>
        }
    </mat-sidenav-content>
</mat-sidenav-container>
