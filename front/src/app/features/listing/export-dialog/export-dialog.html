<h2 mat-dialog-title>{{ t('listing.export.title', { name: data.title }) }}</h2>
<mat-dialog-content class="post-picker">
    <div class="post-picker__tools">
        <mat-form-field appearance="outline" subscriptSizing="dynamic">
            <input
                matInput
                type="search"
                [attr.aria-label]="t('listing.export.search')"
                [placeholder]="t('listing.export.search')"
                [value]="query()"
                (input)="query.set($any($event.target).value)"
                (keydown.escape)="clearSearch($event)"
            />
        </mat-form-field>
        <button mat-button type="button" class="post-picker__toggle-all" [disabled]="!filtered().length" (click)="toggleAll()">
            <!-- both labels in one cell, the other one hidden: the button keeps the width of the longer -->
            <span class="post-picker__toggle-labels">
                <span [class.is-hidden]="!allShownSelected()" [attr.aria-hidden]="!allShownSelected()">{{ t('listing.export.deselectAll') }}</span>
                <span [class.is-hidden]="allShownSelected()" [attr.aria-hidden]="allShownSelected()">{{ t('listing.export.selectAll') }}</span>
            </span>
        </button>
    </div>
    <!-- only the list scrolls: the search stays in view and its focus ring is not clipped -->
    @if (filtered().length) {
        <ul class="post-picker__list" [attr.aria-label]="data.title">
            @for (item of filtered(); track item._id) {
                <li class="post-picker__item">
                    <mat-checkbox [checked]="isSelected(item._id)" (change)="toggle(item._id, $event.checked)">
                        {{ item.title || t('common.untitled') }}
                    </mat-checkbox>
                </li>
            }
        </ul>
    }
    <!-- always there, so a screen reader announces it when a search finds nothing -->
    <p class="field__hint post-picker__none" role="status" [hidden]="filtered().length">
        @if (!filtered().length) {
            {{ t('listing.export.nothingFound') }}
        }
    </p>
</mat-dialog-content>
<mat-dialog-actions>
    <button mat-stroked-button type="button" mat-dialog-close>{{ t('common.cancel') }}</button>
    <button mat-flat-button type="button" [disabled]="!count()" (click)="confirm()">
        {{ t('listing.export.confirm', { count: count() }) }}
    </button>
</mat-dialog-actions>
