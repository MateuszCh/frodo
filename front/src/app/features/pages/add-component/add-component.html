@let component = current();
@let collapsed = collapse.collapsed();
<div class="block-card__head">
    <span class="block-card__index"
          aria-hidden="true"></span>
    @if (component) {
    <button mat-icon-button
            type="button"
            class="btn--sm block-card__toggle"
            [attr.aria-expanded]="!collapsed"
            [attr.aria-label]="t(collapsed ? 'block.showFields' : 'block.hideFields', { name: component.title })"
            (click)="collapse.toggle()">
        <svg class="icon"
             aria-hidden="true">
            <use href="icons.svg#i-chevron-down" />
        </svg>
    </button>
    }
    <mat-form-field appearance="outline"
                    subscriptSizing="dynamic">
        <mat-select [aria-label]="t('block.type')"
                    [placeholder]="t('block.choose')"
                    [ngModel]="component"
                    [ngModelOptions]="{ standalone: true }"
                    [compareWith]="compare"
                    (ngModelChange)="onSelect($event)">
            @for (item of components(); track item.id) {
            <mat-option [value]="item">{{ item.title }}</mat-option>
            }
        </mat-select>
    </mat-form-field>
    <button mat-icon-button
            type="button"
            class="btn--sm"
            [attr.aria-label]="component ? t('block.remove', { name: component.title }) : t('block.removeNew')"
            (click)="remove.emit()">
        <svg class="icon"
             aria-hidden="true">
            <use href="icons.svg#i-trash" />
        </svg>
    </button>
</div>

<!-- hidden, not removed: the fields stay in the form while the component is collapsed -->
@if (component) {
<div class="block-card__body fields"
     [hidden]="collapsed">
    <!-- track the field object: another component may use the same id for a field of
         another kind or with other options, and app-field reads them once -->
    @for (field of component.fields; track field) {
    <app-field [field]="field"
               [model]="model().data!"
               [namePrefix]="'comp_' + order() + '_'"
               [collapseScope]="'component:' + component.type"></app-field>
    }
</div>
}
