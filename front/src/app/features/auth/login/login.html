<main class="auth">
    <div class="auth__card">
        <span class="brand auth__brand">
            <svg class="brand__mark" aria-hidden="true"><use href="icons.svg#logo-mark" /></svg>
            <span class="brand__word">Frodo</span>
        </span>
        <h1 class="auth__title">Sign in</h1>
        @if (exist()) {
            <p class="auth__lead">Manage pages, posts and files of your site.</p>
            <form #form="ngForm" class="auth__form" (ngSubmit)="login(form)">
                <div class="field">
                    <label class="field__label" for="login-username">Username</label>
                    <mat-form-field appearance="outline" subscriptSizing="dynamic">
                        <input
                            matInput
                            id="login-username"
                            name="username"
                            autocomplete="username"
                            required
                            [(ngModel)]="data.username"
                        />
                        <mat-error>
                            <svg class="icon" aria-hidden="true"><use href="icons.svg#i-alert" /></svg>
                            This field is required
                        </mat-error>
                    </mat-form-field>
                </div>
                <div class="field">
                    <label class="field__label" for="login-password">Password</label>
                    <mat-form-field appearance="outline" subscriptSizing="dynamic">
                        <input
                            matInput
                            type="password"
                            id="login-password"
                            name="password"
                            autocomplete="current-password"
                            required
                            [(ngModel)]="data.password"
                        />
                        <mat-error>
                            <svg class="icon" aria-hidden="true"><use href="icons.svg#i-alert" /></svg>
                            This field is required
                        </mat-error>
                    </mat-form-field>
                </div>
                <button mat-flat-button type="submit" [attr.aria-busy]="actionStatus()">
                    @if (actionStatus()) {
                        <span matButtonIcon class="spinner" aria-hidden="true"></span>
                    }
                    {{ actionStatus() ? 'Signing in…' : 'Sign in' }}
                </button>
                <div class="form-message-slot" aria-live="polite">
                    @if (errorMessage()) {
                        <p class="message message--error" role="alert">
                            <svg class="icon" aria-hidden="true"><use href="icons.svg#i-alert" /></svg>
                            {{ errorMessage() }}
                        </p>
                    }
                </div>
            </form>
        } @else {
            <p class="message message--info">
                <svg class="icon" aria-hidden="true"><use href="icons.svg#i-info" /></svg>
                No user account exists yet. Contact the administrator.
            </p>
        }
    </div>
</main>
