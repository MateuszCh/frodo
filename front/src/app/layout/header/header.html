<header class="topbar">
    <button mat-icon-button
            type="button"
            aria-label="Open menu"
            (click)="layout.toggleSidenav()">
        <svg class="icon"
             aria-hidden="true">
            <use href="icons.svg#i-menu" />
        </svg>
    </button>
    <a class="brand"
       routerLink="/">
        <svg class="brand__mark"
             aria-hidden="true">
            <use href="icons.svg#logo-mark" />
        </svg>
        <span class="brand__word">Frodo</span>
    </a>
</header>
