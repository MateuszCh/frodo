@if (data.title || data.confirm) {
    <h2 mat-dialog-title>{{ data.title || t('dialog.confirmDeletion') }}</h2>
}
<mat-dialog-content>{{ server(data.message) }}</mat-dialog-content>
<mat-dialog-actions>
    @if (data.confirm) {
        <button mat-stroked-button type="button" [mat-dialog-close]="false">{{ t('common.cancel') }}</button>
        <button mat-flat-button type="button" class="btn--danger" [mat-dialog-close]="true">
            {{ t('common.delete') }}
        </button>
    } @else {
        <button mat-flat-button type="button" [mat-dialog-close]="true">{{ t('common.ok') }}</button>
    }
</mat-dialog-actions>
