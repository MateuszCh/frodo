@if (data.title || data.confirm) {
    <h2 mat-dialog-title>{{ data.title || 'Confirm deletion' }}</h2>
}
<mat-dialog-content>{{ data.message }}</mat-dialog-content>
<mat-dialog-actions>
    @if (data.confirm) {
        <button mat-stroked-button type="button" [mat-dialog-close]="false">Cancel</button>
        <button mat-flat-button type="button" class="btn--danger" [mat-dialog-close]="true">
            Delete
        </button>
    } @else {
        <button mat-flat-button type="button" [mat-dialog-close]="true">OK</button>
    }
</mat-dialog-actions>
