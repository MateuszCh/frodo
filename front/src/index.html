<!doctype html>
<html lang="pl">
    <head>
        <meta charset="utf-8" />
        <base href="/" />
        <title>Frodo</title>
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <link rel="icon" type="image/x-icon" href="favicon.ico" />
        <link rel="icon" type="image/svg+xml" href="favicon.svg" />
        <link rel="apple-touch-icon" href="apple-touch-icon.png" />
        <link rel="manifest" href="site.webmanifest" />
        <meta name="theme-color" content="#F3F4F1" media="(prefers-color-scheme: light)" />
        <meta name="theme-color" content="#1F2522" media="(prefers-color-scheme: dark)" />
        <script>
            // Apply the saved Light / Dark choice (ThemeService) and language (I18nService)
            // before Angular starts, so a dark page does not flash light. Without a choice
            // the system decides the theme and the language is Polish.
            try {
                var theme = localStorage.getItem('frodo.theme');
                if (theme === 'light' || theme === 'dark') {
                    document.documentElement.dataset.theme = theme;
                }
                var lang = localStorage.getItem('frodo.lang');
                if (lang === 'pl' || lang === 'en') {
                    document.documentElement.lang = lang;
                }
            } catch (e) {}
        </script>
    </head>
    <body>
        <app-root></app-root>
    </body>
</html>
